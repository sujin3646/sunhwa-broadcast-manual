<!DOCTYPE html>

<html lang="ko">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
장비 매뉴얼
</title>


<link rel="stylesheet" href="css/style.css">


</head>



<body>



<header>

<h1>
📖 장비 매뉴얼
</h1>

</header>




<main id="detail">


</main>





<script>


fetch("data/sample.json")


.then(response=>response.json())


.then(data=>{


const id =
new URLSearchParams(location.search)
.get("id");



const item =
data.find(e=>e.id==id);



document.getElementById("detail").innerHTML = `


<div class="card">


<h2>
${item.name}
</h2>


<p>
📂 카테고리 :
${item.category}
</p>



<p>
👤 담당 학생 :
${item.manager}
</p>




<h3>
사용 순서
</h3>


<p>

${item.step.replaceAll("\n","<br>")}

</p>





<h3>
⚠ 주의사항
</h3>


<p>
${item.warning}
</p>



</div>


`;



});



</script>



</body>


</html>
