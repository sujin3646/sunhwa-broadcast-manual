<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>장비 매뉴얼</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<h1>📖 장비 매뉴얼</h1>

</header>



<main id="detail">

</main>



<script>


fetch("./data/sample.json")

.then(response => response.json())

.then(data => {


const id =
new URLSearchParams(location.search)
.get("id");



const item =
data.find(e => e.id == id);



document.getElementById("detail").innerHTML = `


<div class="card">


<h2>
🎤 ${item.name}
</h2>



<p>
📂 <b>카테고리</b><br>
${item.category}
</p>



<p>
👤 <b>담당학생</b><br>
${item.manager}
</p>



<hr>


<p>
⚙ <b>사용방법</b><br>
${item.step.replaceAll("\n","<br>")}
</p>



<hr>


<p>
⚠ <b>주의사항</b><br>
${item.warning.replaceAll("\n","<br>")}
</p>



<h3>
📱 QR 코드
</h3>


<img
src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${location.href}"
>


</div>


`;



});


</script>


</body>

</html>
