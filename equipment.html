<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>장비 매뉴얼</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<h1>📖 장비 매뉴얼</h1>

</header>


<main id="detail"></main>



<script>


fetch("./data/sample.json")

.then(response => response.json())

.then(data => {


const id =
Number(new URLSearchParams(location.search).get("id"));



const item =
data.find(e => Number(e.id) === id);



if(!item){

document.getElementById("detail").innerHTML =
"<div class='card'>장비 정보를 찾을 수 없습니다.</div>";

return;

}




// QR 주소 생성
const pageURL =
window.location.href;



const qrImage =
"https://api.qrserver.com/v1/create-qr-code/?size=250x250&data="
+
encodeURIComponent(pageURL);





document.getElementById("detail").innerHTML = `


<div class="card">


<h2>
🎤 ${item.name}
</h2>



<p>
📂 <b>카테고리</b><br>
${item.category}
</p>



<p>
👤 <b>담당학생</b><br>
${item.manager}
</p>



<hr>



<p>
⚙ <b>사용방법</b><br><br>
${item.step.replaceAll("\n","<br>")}
</p>



<hr>



<p>
⚠ <b>주의사항</b><br><br>
${item.warning.replaceAll("\n","<br>")}
</p>



<hr>



<h3>
📱 장비 QR 코드
</h3>


<img 
class="qr"
src="${qrImage}"
alt="QR 코드"
>



</div>


`;



});


</script>


</body>

</html>
