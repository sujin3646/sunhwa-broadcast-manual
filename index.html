<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>학교 방송부 운영 시스템</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<h1>
🏫 학교 방송부 운영 시스템
</h1>

</header>



<section class="notice-box">

<h2>
📢 공지사항
</h2>

<ul>

<li>방송 장비 사용 후 정리하기</li>

<li>장비 이상 발견 시 방송부장에게 전달</li>

</ul>

</section>




<section>


<h2>
🔍 장비 검색
</h2>


<input 
id="search"
placeholder="장비명 / 카테고리 / 담당학생 검색"
onkeyup="searchEquipment()"
>



<div class="category">


<button onclick="filterCategory('전체')">
전체
</button>


<button onclick="filterCategory('강당')">
📂 강당
</button>


<button onclick="filterCategory('방송실')">
📂 방송실
</button>


</div>



</section>




<section>


<h2>
🎤 장비 목록
</h2>


<div id="equipmentList">

</div>


</section>





<script src="js/app.js"></script>


</body>

</html>
